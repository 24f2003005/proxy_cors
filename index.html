<!DOCTYPE html>
<html lang="en">
<body>
  <pre id="out">Loading live data...</pre>
  <script>
    const targetUrl = 'https://tds-p1-q5-spww.onrender.com/run.jsonl?nocache=' + Date.now();
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

    fetch(proxyUrl)
      .then(res => {
        if (!res.ok) throw new Error("Proxy blocked or failed.");
        return res.text();
      })
      .then(data => document.getElementById('out').textContent = data)
      .catch(err => document.getElementById('out').textContent = 'Error: ' + err.message);
  </script>
</body>
</html>
