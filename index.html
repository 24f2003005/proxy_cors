<!DOCTYPE html>
<html lang="en">
<body>
  <pre id="out"></pre> 
  <script>
    const googleScriptUrl = 'https://script.google.com/macros/s/AKfycbzhGONIBxcRFNd5PIYCT34iEkJIu557j3ooHNbD9PJXcWK3nV0q-OpPQSrCAyuyhhvP/exec';
    
    fetch(googleScriptUrl)
      .then(res => res.text())
      .then(data => {
          if(data) document.getElementById('out').textContent = data;
      });
  </script>
</body>
</html>
